<!DOCTYPE html>  <html lang="fa" dir="rtl">  <head>    <meta charset="UTF-8">      <meta name="viewport" content="width=device-width, initial-scale=1.0">  <title>پنل مدیریت mimi shop</title>  <style>    *{  box-sizing:border-box;  }  body{  margin:0;  font-family:Arial,sans-serif;  background:#fff5f8;  color:#333;  }

.admin-header{
background:#d6336c;
color:white;
padding:25px;
text-align:center;
box-shadow:0 5px 20px rgba(0,0,0,.1);
}

.admin-header h1{
margin:0;
}

.admin-container{
width:90%;
max-width:1000px;
margin:30px auto;
}

.admin-card{
background:white;
padding:25px;
margin-bottom:25px;
border-radius:20px;
border:1px solid #f3c4d5;
box-shadow:0 8px 25px rgba(214,51,108,.08);
}

.admin-card h2{
color:#d6336c;
margin-top:0;
}

.form-group{
margin-bottom:18px;
text-align:right;
}

.form-group label{
display:block;
margin-bottom:7px;
font-weight:bold;
}

.form-group input,
.form-group textarea,
.form-group select{
width:100%;
padding:13px;
border:1px solid #f3c4d5;
border-radius:10px;
font-size:16px;
}

.form-group textarea{
height:120px;
resize:vertical;
}

.admin-button{
background:#d6336c;
color:white;
border:none;
padding:13px 25px;
border-radius:10px;
font-size:17px;
cursor:pointer;
}

.admin-button:hover{
background:#b52b5a;
}

.discount-box{
background:#fff0f5;
padding:20px;
border-radius:15px;
border:1px solid #f3c4d5;
margin-top:15px;
}

.banner-list{
display:grid;
grid-template-columns:repeat(3,1fr);
gap:15px;
}

.banner-item{
border:1px solid #f3c4d5;
padding:10px;
border-radius:15px;
text-align:center;
}

.banner-item img{
width:100%;
height:120px;
object-fit:cover;
border-radius:10px;
}

@media(max-width:600px){

.admin-container{
width:94%;
}

.banner-list{
grid-template-columns:1fr;
}

}

</style>  </head>  <body>  <header class="admin-header">  <h1>🌸 پنل مدیریت mimi shop</h1>  <p>مدیریت فروشگاه</p>  </header>  <div class="admin-container">  <!-- مدیریت محصول -->  <div class="admin-card">  <h2>🛍️ مدیریت محصولات</h2>  <div class="form-group">
<label>انتخاب محصول</label>
<select id="productSelect">

<option value="0">🎀 ست گیپوری</option>          
<option value="1">👙 ست سه تیکه ساتن</option>          
<option value="2">💗 شورت لامبادا</option>          
<option value="3">🎀 ست کاپدار</option>          
<option value="4">💕 شورت فانتزی</option>          
<option value="5">👙 سوتین تک</option>          
<option value="6">🌸 ست تورگاز</option>          
<option value="7">🌙 لباسخواب</option>          
<option value="8">✨ نیم تنه</option>  </select>  </div>  <div class="form-group">                      
<label>نام محصول</label>                      
<input type="text" id="productName">                      
</div>  <div class="form-group">                      
<label>توضیحات محصول</label>                      
<textarea id="productDescription"></textarea>                      
</div>  <div class="form-group">                      
<label>قیمت محصول (تومان)</label>                      
<input type="number" id="productPrice">                      
</div>             
<div class="form-group">                      
<label>عکس محصول</label>                      
<input type="file" id="productImage" accept="image/*">                      
</div>  <button class="admin-button" onclick="saveProduct()">                      
💾 ذخیره تغییرات                      
</button>  <div id="productStatus" class="status"></div>  </div>        
<div class="admin-card">  <h2>🔥 مدیریت تخفیف</h2>  <div class="form-group">  <label>انتخاب محصول</label>        
<select id="discountProduct">  <option value="gipouri">🎀 ست گیپوری</option>      
<option value="satin">👙 ست سه تیکه ساتن</option>      
<option value="lambada">💗 شورت لامبادا</option>      
<option value="kapdar">🎀 ست کاپدار</option>      
<option value="fantasy">💕 شورت فانتزی</option>      
<option value="bra">👙 سوتین تک</option>      
<option value="torgaz">🌸 ست تورگاز</option>      
<option value="sleepwear">🌙 لباسخواب</option>      
<option value="croptop">✨ نیم تنه</option>  </select>      
</div>        
<div class="form-group">  <label>درصد تخفیف</label>  <input                  
type="number"                  
id="discountPercent"                  
placeholder="مثلاً 20"                  
min="0"                  
max="100"  >   </div>  <div class="discount-box">          
<div class="form-group">  <label>تاریخ پایان تخفیف</label>  <input                  
type="datetime-local"                  
id="discountEnd"  >   </div>  <button                    
class="admin-button"                    
onclick="saveDiscount()"  >   🔥 فعال کردن تخفیف  </button>  </div>  </div>  <!-- بنر -->  <div class="admin-card">  <h2>🖼️ مدیریت بنرهای بالای سایت</h2>  <div class="banner-list">  <div class="banner-item">  <img src="banner1.jpg">  <p>بنر ۱</p>  <input              
type="file"              
accept="image/*"  >   </div>  <div class="banner-item">  <img src="banner2.jpg">  <p>بنر ۲</p>  <input                    
type="file"                    
accept="image/*"  >   </div>  <div class="banner-item">  <img src="banner3.jpg">  <p>بنر ۳</p>  <input                    
type="file"                    
accept="image/*"  >   </div>  <div class="banner-item">  <img src="banner4.jpg">  <p>بنر ۴</p>  <input                    
type="file"                    
accept="image/*"  >   </div>  <div class="banner-item">  <img src="banner5.jpg">  <p>بنر ۵</p>  <input                    
type="file"                    
accept="image/*"  >   </div>  <div class="banner-item">  <img src="banner6.jpg">  <p>بنر ۶</p>  <input                    
type="file"                    
accept="image/*"  >   </div>  </div>  </div>  <!-- تایمر -->  <div class="admin-card">  <h2>⏰ مدیریت تایمر فروش ویژه</h2>  <div class="form-group">  <label>                      
تاریخ و زمان پایان فروش ویژه                      
</label>  <input                    
type="datetime-local"                    
id="offerEnd"  >   </div>  <button                    
class="admin-button"                    
onclick="saveOfferTimer()"  >   ⏰ ذخیره تایمر  </button>  </div>  </div>  <script>     
const defaultProducts = [      
{      
name: "محصول ست گیپوری",      
description: "توضیحات ست گیپوری",      
price: 0,      
image: "",      
category: "gipouri"      
},      
{      
name: "محصول ست سه تیکه ساتن",      
description: "توضیحات ست سه تیکه ساتن",      
price: 0,      
image: "",      
category: "satin"      
},      
{      
name: "محصول شورت لامبادا",      
description: "توضیحات شورت لامبادا",      
price: 0,      
image: "",      
category: "lambada"      
},      
{      
name: "محصول ست کاپدار",      
description: "توضیحات ست کاپدار",      
price: 0,      
image: "",      
category: "kapdar"      
},      
{      
name: "محصول شورت فانتزی",      
description: "توضیحات شورت فانتزی",      
price: 0,      
image: "",      
category: "fantasy"      
},      
{      
name: "محصول سوتین تک",      
description: "توضیحات سوتین تک",      
price: 0,      
image: "",      
category: "bra"      
},      
{      
name: "محصول ست تورگاز",      
description: "توضیحات ست تورگاز",      
price: 0,      
image: "",      
category: "torgaz"      
},      
{      
name: "محصول لباسخواب",      
description: "توضیحات لباسخواب",      
price: 0,      
image: "",      
category: "sleepwear"      
},      
{      
name: "محصول نیم تنه",      
description: "توضیحات نیم تنه",      
price: 0,      
image: "",      
category: "croptop"      
}      
];    let adminProducts =
JSON.parse(localStorage.getItem("mimiProducts"));

/* اگر اطلاعات محصولات وجود ندارد یا ناقص است */
if(
!Array.isArray(adminProducts) ||
adminProducts.length !== defaultProducts.length
){

adminProducts =
JSON.parse(JSON.stringify(defaultProducts));

localStorage.setItem(
"mimiProducts",
JSON.stringify(adminProducts)
);

}

/* بارگذاری محصول انتخاب شده */

function loadProduct(){

const index =
Number(
document.getElementById("productSelect").value
);

const product =
adminProducts[index];

if(!product){
return;
}

document.getElementById("productName").value =
product.name || "";

document.getElementById("productDescription").value =
product.description || "";

document.getElementById("productPrice").value =
product.price || "";

}

/* تغییر محصول */

document
.getElementById("productSelect")
.addEventListener(
"change",
loadProduct
);

/* ذخیره محصول */

function saveProduct(){

const index =
Number(
document.getElementById("productSelect").value
);

const categories = [

"gipouri",
"satin",
"lambada",
"kapdar",
"fantasy",
"bra",
"torgaz",
"sleepwear",
"croptop"

];

const name =
document
.getElementById("productName")
.value
.trim();

const description =
document
.getElementById("productDescription")
.value
.trim();

const price =
Number(
document.getElementById("productPrice").value
);

const file =
document
.getElementById("productImage")
.files[0];

if(!name){

alert("⚠️ نام محصول را وارد کن.");

return;

}

if(!price || price <= 0){

alert("⚠️ قیمت محصول را وارد کن.");

return;

}

/* اطمینان از وجود محصول */

if(!adminProducts[index]){

adminProducts[index] = {

name:"",
description:"",
price:0,
image:"",
category:categories[index]

};

}

/* اطلاعات محصول */

adminProducts[index].name =
name;

adminProducts[index].description =
description;

adminProducts[index].price =
price;

adminProducts[index].category =
categories[index];

/* اگر عکس جدید انتخاب شده */

if(file){

const reader =
new FileReader();

reader.onload =
function(){

adminProducts[index].image =
reader.result;

localStorage.setItem(
"mimiProducts",
JSON.stringify(adminProducts)
);

showStatus(
"productStatus",
"✅ محصول و عکس با موفقیت ذخیره شد."
);

/* پاک کردن انتخاب فایل */

document.getElementById(
"productImage"
).value = "";

};

reader.readAsDataURL(file);

}else{

/* ذخیره بدون تغییر عکس */

localStorage.setItem(
"mimiProducts",
JSON.stringify(adminProducts)
);

showStatus(
"productStatus",
"✅ محصول با موفقیت ذخیره شد."
);

}

}

function showStatus(id, message){

const element = document.getElementById(id);

element.innerText = message;
element.style.color = "#d6336c";
element.style.marginTop = "15px";
element.style.fontWeight = "bold";

}

loadProduct();

console.log(localStorage.getItem("mimiProducts"));

function saveDiscount(){

let product =
document.getElementById("discountProduct").value;

let percent =
document.getElementById("discountPercent").value;

let end =
document.getElementById("discountEnd").value;

if(!percent || !end){

alert("⚠️ درصد تخفیف و زمان پایان را وارد کن.");

return;

}

localStorage.setItem(
"mimiDiscount",
JSON.stringify({
product: product,
percent: Number(percent),
end: new Date(end).getTime()
})
);
alert("🔥تخفیف با موفقیت فعال شد.");
}

function saveOfferTimer(){

let end =
document.getElementById("offerEnd").value;

if(!end){

alert("⚠️ زمان پایان را انتخاب کن.");

return;

}

localStorage.setItem(
"offerEndTime",
new Date(end).getTime()
);

alert("✅ تایمر فروش ویژه ذخیره شد.");

}

</script>  </body>  </html>
